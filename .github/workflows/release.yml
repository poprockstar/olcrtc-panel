name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: go test ./...
      - run: GOOS=linux GOARCH=amd64 go build -o olcpanel ./cmd/olcpanel
      - run: tar -czf olcpanel-linux-amd64.tar.gz olcpanel install.sh update.sh deploy/olcpanel.service
      - run: sha256sum olcpanel-linux-amd64.tar.gz > olcpanel-linux-amd64.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            olcpanel-linux-amd64.tar.gz
            olcpanel-linux-amd64.tar.gz.sha256
